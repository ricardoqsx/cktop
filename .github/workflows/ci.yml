name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/*/go.sum
            libs/*/go.sum

      - name: Check format
        run: test -z "$(gofmt -l apps libs scripts/package-dtop.go)"

      - name: Check release scripts
        run: sh -n scripts/install-dtop.sh scripts/render-dtop-installer.sh scripts/test-install-dtop.sh

      - name: Test
        run: go test ./apps/dtop/... ./apps/ktop/... ./libs/tui/...

      - name: Vet
        run: go vet ./apps/dtop/... ./apps/ktop/... ./libs/tui/...

      - name: Build dtop
        run: go build ./apps/dtop/cmd/dtop

      - name: Build ktop
        run: go build ./apps/ktop/cmd/ktop

name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/*/go.sum
            libs/*/go.sum

      - name: Check format
        run: test -z "$(gofmt -l apps libs scripts/package-dtop.go)"

      - name: Check release scripts
        run: sh -n scripts/install-dtop.sh scripts/render-dtop-installer.sh scripts/test-install-dtop.sh

      - name: Test
        run: go test ./apps/dtop/... ./apps/ktop/... ./libs/tui/...

      - name: Vet
        run: go vet ./apps/dtop/... ./apps/ktop/... ./libs/tui/...

      - name: Build dtop
        run: go build ./apps/dtop/cmd/dtop

      - name: Build ktop
        run: go build ./apps/ktop/cmd/ktop

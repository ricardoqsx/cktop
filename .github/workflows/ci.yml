name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/*/go.sum
            libs/*/go.sum

      - name: Check format
        run: test -z "$(gofmt -l apps libs)"

      - name: Test
        run: go test ./apps/dtop/... ./apps/ktop/... ./libs/tui/...

      - name: Vet
        run: go vet ./apps/dtop/... ./apps/ktop/... ./libs/tui/...

      - name: Build dtop
        run: go build ./apps/dtop/cmd/dtop

      - name: Build ktop
        run: go build ./apps/ktop/cmd/ktop
